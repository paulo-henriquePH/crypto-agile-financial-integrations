openapi: 3.1.0
info:
  title: Plataforma financeira — contrato experimental
  version: 1.0.0
  description: >-
    Especificação, não um serviço disponível. Assinaturas nos exemplos são
    ilustrativas e não criptográficas até S1-17. Todas as mensagens após
    autenticação são assinadas conforme contracts/messages/README.md.
paths:
  /v1/operations:
    post:
      operationId: createOperation
      description: >-
        CREATE_OPERATION não contém operationId; senderId autenticado identifica
        managerId e clientOrderId identifica a boleta. Autenticar, verificar
        validade e autorização antes de consultar idempotência. A chave lógica
        é (managerId, clientOrderId); SHA-256 do negócio normalizado JCS exclui
        messageId, horários de transporte, assinatura e política. Mesmo payload
        devolve resultado anterior em novo envelope correlacionado à tentativa
        atual; payload diferente gera 409 IDEMPOTENCY_CONFLICT. Primeiro registro
        retorna 201 e Location; replay retorna 200 e Location. Rejeição de domínio
        persistida retorna 201 (200 no replay), CREATE_OPERATION_RESULT com
        operationId protegido, REJECTED, rejectionOrigin LOCAL e reason.
        Erro sintático não cria operação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create'
            examples:
              creation:
                externalValue: ../messages/examples.json#/cases/0/message
              localRejectionInput:
                externalValue: scenarios.json#/rejectedRequest
              replayInput:
                externalValue: scenarios.json#/replayRequest
              conflictInput:
                externalValue: scenarios.json#/conflictRequest
      responses:
        '201':
          description: Operação persistida, inclusive rejeição local.
          headers:
            Location:
              required: true
              description: /v1/operations/{operationId} identifica o recurso, não especifica um endpoint GET.
              schema:
                type: string
                example: /v1/operations/11111111-1111-4111-8111-111111111111
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResult'
              examples:
                created:
                  externalValue: ../messages/examples.json#/cases/1/message
                localRejection:
                  externalValue: ../messages/examples.json#/cases/24/message
        '200':
          description: Replay idempotente do resultado de criação, com correlação e política de saída atuais.
          headers:
            Location:
              required: true
              schema:
                type: string
                example: /v1/operations/11111111-1111-4111-8111-111111111111
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResult'
              examples:
                replay:
                  externalValue: scenarios.json#/replayResult
        '400':
          description: Esquema inválido; parsing pode impedir resposta assinada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              examples:
                invalid:
                  externalValue: ../messages/examples.json#/cases/12/message
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Identidade lógica reutilizada com negócio diferente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  externalValue: errors.json#/conflict
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/operations/{operationId}/status-queries:
    post:
      operationId: queryOperation
      description: >-
        QUERY_OPERATION carrega contexto assinado; operationId no caminho deve
        ser igual ao protegido. Cada consulta nova usa novo messageId e lê
        snapshot atual; apenas repetição exata ainda válida pode reusar resposta.
        O resultado correlaciona requestMessageId, operação, versão, ambiente e
        identidades e inclui eventos, entrega e conciliação independentes.
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
            examples:
              query:
                externalValue: ../messages/examples.json#/cases/2/message
      responses:
        '200':
          description: Estado e histórico da projeção local.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResult'
              examples:
                snapshot:
                  externalValue: ../messages/examples.json#/cases/3/message
                localRejection:
                  externalValue: ../messages/examples.json#/cases/26/message
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Ausência autenticada, assinada e correlacionada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                absent:
                  externalValue: errors.json#/notFound
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimit'
        '503':
          $ref: '#/components/responses/Unavailable'
security:
  - mutualTLS: []
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: >-
        TLS 1.3, CA local, cadeia e nome do servidor verificados, certificados
        individuais; identidade autenticada vinculada a senderId e autorização.
        Grupo X25519 ou X25519MLKEM768 conforme política, sem fallback; sem 0-RTT.
  schemas:
    Create:
      allOf:
        - $ref: ../messages/envelope.schema.json
        - properties:
            protected:
              properties:
                messageType: {const: CREATE_OPERATION}
    Query:
      allOf:
        - $ref: ../messages/envelope.schema.json
        - properties:
            protected:
              properties:
                messageType: {const: QUERY_OPERATION}
    CreateResult:
      allOf:
        - $ref: ../messages/envelope.schema.json
        - properties:
            protected:
              properties:
                messageType: {const: CREATE_OPERATION_RESULT}
    QueryResult:
      allOf:
        - $ref: ../messages/envelope.schema.json
        - properties:
            protected:
              properties:
                messageType: {const: QUERY_OPERATION_RESULT}
    Error:
      allOf:
        - $ref: ../messages/envelope.schema.json
        - properties:
            protected:
              properties:
                messageType: {const: ERROR}
  responses:
    BadRequest:
      description: Esquema inválido; parsing ou handshake podem impedir resposta assinada.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Autenticação ausente ou falha; handshake pode terminar sem resposta HTTP.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Ação não autorizada; erro após autenticação assinado.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Conflito de identidade ou messageId.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unprocessable:
      description: Regra de negócio não processável sem criação; rejeição local persistida usa resultado identificado.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimit:
      description: Limite excedido.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Indisponibilidade transitória não implica rejeição financeira.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
