# Last overlay after persistence, platform, custodian and settlement.
x-runtime: &runtime
  image: cafi-platform:s2-09
  platform: linux/amd64
  working_dir: /repo
  read_only: true
  user: "999:999"
  security_opt: [no-new-privileges:true]
  environment: {PYTHONPATH: /repo, PYTHONDONTWRITEBYTECODE: "1"}
  cap_drop: [ALL]
services:
  platform:
    image: cafi-platform:s2-09
  manager:
    image: cafi-platform:s2-09
  identity:
    image: cafi-custodian:s2-09
    volumes: !override
      - custody_identity:/identities/platform
      - custodian_identity:/identities/custodian
  client:
    image: cafi-custodian:s2-09
    volumes: !override
      - custody_identity:/identity:ro
  custodian:
    image: cafi-custodian:s2-09
  runner:
    image: cafi-custodian:s2-09
  manager-identity-init:
    <<: *runtime
    profiles: [tools]
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE]
    network_mode: none
    tmpfs: [/tmp]
    command: [python, -m, deploy.platform.identity]
    volumes:
      - manager_identity:/identities/manager
      - platform_identity:/identities/platform
  worker:
    <<: *runtime
    entrypoint: [python, -m, services.platform.custody_worker]
    volumes:
      - custody_identity:/custody-identity:ro
      - platform_key:/credentials/platform:ro
volumes:
  custody_identity:
